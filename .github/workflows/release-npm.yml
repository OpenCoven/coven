name: Release npm packages

# Tag-driven, OIDC-authenticated release pipeline.
#
# Trigger: any `v*` tag push starts the workflow.
# Auth: npm trusted publishing via GitHub Actions OIDC — no long-lived NPM_TOKEN required. Configure
#       @opencoven/cli and each @opencoven/cli-* native package on npmjs.com
#       -> Settings -> Trusted Publishers before the first OIDC release.
# Gate: the `verify-tag` job requires an SSH-signed annotated tag, confirms GitHub has cryptographically
#       verified it, and checks that local git verification trusts the release signing key
#       (e.g. `git config gpg.format ssh && git tag -s v0.0.17 -m "..." && git push origin v0.0.17`).

on:
  push:
    tags:
      - 'v*'

# Workflow-level least-privilege. Individual jobs escalate explicitly.
permissions:
  contents: read

# Never run two release pipelines for the same tag at the same time. We don't cancel an in-flight
# release because that could leave the registry in a partially-published state.
concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-05-20
        with:
          components: clippy, rustfmt
      - name: Install native link dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 scripts/check-secrets-test.py
      - run: python3 scripts/check-secrets.py

  verify-tag:
    name: Verify signed release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release-context.outputs.release_tag }}
      npm_version: ${{ steps.release-context.outputs.npm_version }}
      native_package_set: post-intel
      platform_matrix: ${{ steps.platform-matrix.outputs.platform_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0
        with:
          fetch-depth: 0
      - name: Derive stable release context
        id: release-context
        run: node scripts/release-npm-context.mjs "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Confirm tag is annotated and signer-authorized
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_RELEASE_ALLOWED_SIGNERS: ${{ vars.NPM_RELEASE_ALLOWED_SIGNERS }}
        run: |
          set -euo pipefail
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          TAG_OBJECT_SHA=$(git rev-parse "$TAG_NAME")
          OBJECT_TYPE=$(git cat-file -t "$TAG_OBJECT_SHA")
          if [ "$OBJECT_TYPE" != "tag" ]; then
            echo "::error::Refusing to release: $TAG_NAME is a lightweight tag, not an annotated signed tag. Re-tag with \`git tag -s vX.Y.Z -m ...\`."
            exit 1
          fi
          payload=$(gh api "/repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA")
          verified=$(jq -r '.verification.verified' <<<"$payload")
          reason=$(jq -r '.verification.reason' <<<"$payload")
          if [ "$verified" != "true" ]; then
            echo "::error::Tag $TAG_NAME does not have a GitHub-verified signature (reason=$reason). Re-tag with a signing key registered to your GitHub account."
            exit 1
          fi
          tag_object_type=$(jq -r '.object.type // ""' <<<"$payload")
          TAGGED_COMMIT_SHA=$(jq -r '.object.sha // ""' <<<"$payload")
          echo "tag=$TAG_NAME verified=$verified reason=$reason target=$TAGGED_COMMIT_SHA"
          if [ "$tag_object_type" != "commit" ] || [ -z "$TAGGED_COMMIT_SHA" ]; then
            echo "::error::Refusing release: annotated tag $TAG_NAME targets ${tag_object_type:-unknown}, not a commit."
            exit 1
          fi
          allowed_signers_raw="${NPM_RELEASE_ALLOWED_SIGNERS:-}"
          if [ -z "${allowed_signers_raw//[[:space:]]/}" ]; then
            echo "::error::Repository variable NPM_RELEASE_ALLOWED_SIGNERS must contain one or more SSH allowed-signers lines."
            exit 1
          fi
          allowed_signers_file="$RUNNER_TEMP/coven-release-allowed-signers"
          printf '%s\n' "$allowed_signers_raw" > "$allowed_signers_file"
          line_number=0
          while IFS= read -r signer_line || [ -n "$signer_line" ]; do
            line_number=$((line_number + 1))
            if [[ "$signer_line" =~ ^[[:space:]]*$ ]]; then
              echo "::error::NPM_RELEASE_ALLOWED_SIGNERS contains an empty line at line $line_number."
              exit 1
            fi
          done < "$allowed_signers_file"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$allowed_signers_file"
          if ! verify_output=$(git verify-tag "$TAG_NAME" 2>&1); then
            printf '%s\n' "$verify_output"
            echo "::error::Release tag $TAG_NAME is not signed by a key in NPM_RELEASE_ALLOWED_SIGNERS."
            exit 1
          fi
          printf '%s\n' "$verify_output"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAGGED_COMMIT_SHA" origin/main; then
            echo "::error::Refusing release: tagged commit $TAGGED_COMMIT_SHA is not contained in origin/main."
            exit 1
          fi
      - name: Derive release platform matrix
        id: platform-matrix
        env:
          NATIVE_PACKAGE_SET: post-intel
        run: node scripts/release-npm-platform-matrix.mjs "$NATIVE_PACKAGE_SET" >> "$GITHUB_OUTPUT"

  performance-baseline:
    name: Release performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, verify-tag]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-20
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-release-perf-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-perf-
      - name: Install native link dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev
      - name: Build coven
        run: cargo build -p coven-cli --locked
      - name: Validate benchmark runner
        run: node --test scripts/benchmark-cli.test.mjs scripts/benchmark-chaos.test.mjs
      - name: Collect release baseline artifact
        run: node scripts/benchmark-cli.mjs --binary target/debug/coven --iterations 3 --output coven-perf.json
      - name: Collect concurrent runtime baseline artifact
        continue-on-error: true
        run: node scripts/benchmark-chaos.mjs --binary target/debug/coven --output coven-chaos.json
      - name: Collect deterministic TUI scheduling metric
        run: |
          set -o pipefail
          cargo test -p coven-cli --bin coven tui::chat::events::tests::benchmark_schedule_metrics_emit_json --locked -- --ignored --nocapture | tee coven-tui-metrics.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: coven-release-performance-${{ needs.verify-tag.outputs.release_tag }}
          path: |
            coven-perf.json
            coven-chaos.json
            coven-tui-metrics.txt
          if-no-files-found: error

  build-platform:
    name: Build ${{ matrix.npm-target }}
    runs-on: ${{ matrix.runner }}
    needs: [verify, verify-tag]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-tag.outputs.platform_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable @ 2026-05-20
        with:
          targets: ${{ matrix.rust-target }}
      - name: Install native link dependencies
        if: matrix.npm-target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev
      - run: cargo build --release --package coven-cli --target ${{ matrix.rust-target }}
        env:
          COVEN_BUILD_VERSION: v${{ needs.verify-tag.outputs.npm_version }}
      # The per-mount NFS export process, which the daemon spawns and locates
      # beside its own executable. macOS only: `afs_mount::backend()` returns
      # None on other platforms, and the `mount` feature does not compile on
      # Windows. Without this the package ships one binary and every installed
      # user gets `afsMount: false` (coven-g2t).
      - name: Build the AFS mount export helper (macOS only)
        if: startsWith(matrix.npm-target, 'macos')
        run: cargo build --release -p coven-afs --features mount --bins --target ${{ matrix.rust-target }}
        env:
          COVEN_BUILD_VERSION: v${{ needs.verify-tag.outputs.npm_version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.0
        with:
          name: coven-${{ matrix.npm-target }}
          # Both binaries when the helper was built; the glob matches nothing
          # extra on platforms that skipped it.
          path: |
            target/${{ matrix.rust-target }}/release/${{ matrix.binary }}
            target/${{ matrix.rust-target }}/release/coven-afs-serve
          if-no-files-found: error

  npm-dry-run:
    name: npm publish dry-run
    runs-on: ubuntu-latest
    needs: [build-platform, verify-tag]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.0
        with:
          name: coven-macos
          path: target/aarch64-apple-darwin/release
      - run: chmod +x target/aarch64-apple-darwin/release/coven
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.0
        with:
          name: coven-macos-x64
          path: target/x86_64-apple-darwin/release
      - run: chmod +x target/x86_64-apple-darwin/release/coven
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.0
        with:
          name: coven-linux-x64
          path: target/x86_64-unknown-linux-gnu/release
      - run: chmod +x target/x86_64-unknown-linux-gnu/release/coven
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.0
        with:
          name: coven-windows
          path: target/x86_64-pc-windows-msvc/release
      - run: node scripts/publish-npm.mjs --target=macos --skip-build --dry-run --skip-wrapper
        env:
          COVEN_NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
      - run: node scripts/publish-npm.mjs --target=macos-x64 --skip-build --dry-run --skip-wrapper
        env:
          COVEN_NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
      - run: node scripts/publish-npm.mjs --target=linux-x64 --skip-build --dry-run --skip-wrapper
        env:
          COVEN_NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
      - run: node scripts/publish-npm.mjs --target=windows --skip-build --dry-run --skip-wrapper
        env:
          COVEN_NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
      - run: node scripts/publish-npm.mjs --wrapper-only --dry-run
        env:
          COVEN_NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
          COVEN_NPM_NATIVE_PACKAGE_SET: ${{ needs.verify-tag.outputs.native_package_set }}

  npm-publish:
    name: npm publish
    runs-on: ubuntu-latest
    needs: [build-platform, npm-dry-run, performance-baseline, verify-tag]
    # OIDC trusted publishing: id-token:write lets the job mint a short-lived OIDC token
    # that `npm publish --provenance` exchanges with the npm registry for a one-shot
    # publish credential. No NPM_TOKEN secret is read or written.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.0
        with:
          name: coven-macos
          path: target/aarch64-apple-darwin/release
      - run: chmod +x target/aarch64-apple-darwin/release/coven
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.0
        with:
          name: coven-macos-x64
          path: target/x86_64-apple-darwin/release
      - run: chmod +x target/x86_64-apple-darwin/release/coven
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.0
        with:
          name: coven-linux-x64
          path: target/x86_64-unknown-linux-gnu/release
      - run: chmod +x target/x86_64-unknown-linux-gnu/release/coven
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.0
        with:
          name: coven-windows
          path: target/x86_64-pc-windows-msvc/release
      - name: Refuse placeholder version
        env:
          NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
        run: |
          set -euo pipefail
          if [ "$NPM_VERSION" = "0.0.0" ]; then
            echo "::error::Refusing to publish placeholder version $NPM_VERSION"
            exit 1
          fi
      - name: Preflight npm native package availability
        run: |
          set -euo pipefail
          require_package() {
          local package_name="$1"
          local output
          if output=$(npm view "$package_name" name 2>&1); then
          return 0
          fi
          printf '%s\n' "$output"
          if ! grep -q 'E404' <<<"$output"; then
          echo "::error::Package availability for $package_name could not be verified; resolve the npm registry error before publishing."
          exit 1
          fi
          echo "::error::Publish a bootstrap version for $package_name, configure npm trusted publishing for OpenCoven/coven and release-npm.yml with no environment, then push a new patch-bumped signed tag. npm assigns latest to an initial public publish; do not publish the wrapper until the production package exists."
          exit 1
          }
          require_package @opencoven/cli-linux-x64
          require_package @opencoven/cli-windows
          require_package @opencoven/cli-macos-x64
          require_package @opencoven/cli-macos
      - run: node scripts/publish-npm.mjs --target=linux-x64 --skip-build --publish --skip-wrapper
        env:
          COVEN_NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
      - run: node scripts/publish-npm.mjs --target=windows --skip-build --publish --skip-wrapper
        env:
          COVEN_NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
      - run: node scripts/publish-npm.mjs --target=macos-x64 --skip-build --publish --skip-wrapper
        env:
          COVEN_NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
      - run: node scripts/publish-npm.mjs --target=macos --skip-build --publish --skip-wrapper
        env:
          COVEN_NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
      - run: node scripts/publish-npm.mjs --wrapper-only --publish
        env:
          COVEN_NPM_VERSION: ${{ needs.verify-tag.outputs.npm_version }}
          COVEN_NPM_NATIVE_PACKAGE_SET: ${{ needs.verify-tag.outputs.native_package_set }}
