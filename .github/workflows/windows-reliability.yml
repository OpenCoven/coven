          $PSNativeCommandUseErrorActionPreference=$false
          $admitted=$false
          $sourcePath=Join-Path $env:TOKEN_ROOT 'source.json'
          $sourceMatches=(Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash -ceq $env:TOKEN_SOURCE_SHA256
          $source=Get-Content -LiteralPath $sourcePath -Raw | ConvertFrom-Json
          $head=git rev-parse HEAD
          $headMatches=$LASTEXITCODE -eq 0 -and $head -ceq $env:GITHUB_SHA -and $head -ceq $source.commit
          $dirty=@(git status --porcelain=v1 --untracked-files=all)
          $clean=$LASTEXITCODE -eq 0 -and $dirty.Count -eq 0
          # Execute the same bounded private bytes that the closed inventory later names.
          # A path reread after dot-sourcing would not identify the executed script block.
          $binderPath=Join-Path $pwd 'scripts/windows-reliability/token-binding.ps1'
          $binderStream=[IO.File]::Open($binderPath,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
          try {
              $binderBuffer=[byte[]]::new(262145)
              $binderUsed=0
              while ($binderUsed -lt $binderBuffer.Length) {
                  $count=$binderStream.Read($binderBuffer,$binderUsed,$binderBuffer.Length-$binderUsed)
                  if ($count -eq 0) { break }
                  $binderUsed+=$count
              }
              if ($binderUsed -eq 0 -or $binderUsed -gt 262144) { throw 'source' }
              $binderBytes=$binderBuffer[0..($binderUsed-1)]
          } finally { $binderStream.Dispose() }
          $binderHash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([byte[]]$binderBytes)).ToLowerInvariant()
          . ([scriptblock]::Create([Text.UTF8Encoding]::new($false,$true).GetString([byte[]]$binderBytes)))
          $capture=Get-CovenTokenSourceCapture -Directory ([string]$pwd) -Commit $head
          $ids=[string[]]@((Get-CovenTokenSourceInventory).Keys);[Array]::Sort($ids,[Collections.IComparer][StringComparer]::Ordinal)
          $current=@(foreach($id in $ids){@($capture.Files|Where-Object {$_.Id -ceq $id})[0]})
          $sameFiles=$current.Count -eq $source.files.Count
          for ($i=0;$i -lt $current.Count -and $sameFiles;$i++) {
            $sameFiles=$current[$i].Id -ceq $source.files[$i].id -and $current[$i].Sha256 -ceq $source.files[$i].sha256
          }
          $binder=@($capture.Files | Where-Object { $_.Id -ceq 'binding' })[0]
          $bound=$sourceMatches -and $headMatches -and $clean -and $binder.Sha256 -ceq $binderHash -and $sameFiles
          if(-not $bound){throw 'Token source changed before artifact admission'}
          if(-not [string]::IsNullOrEmpty($env:PUBLIC_RECEIPT)){
            $pythonCommands=@(Get-Command python -CommandType Application -ErrorAction Stop)
            $python=$pythonCommands[0].Source
            $snapshotHash=$env:TOKEN_SOURCE_SHA256
            $snapshotHash=$snapshotHash.ToLowerInvariant()
            $invocation=New-CovenTokenArtifactInvocation -Capture $capture -Executable $python -SourcePath $sourcePath -SnapshotHash $snapshotHash -TemporaryRoot $env:TOKEN_TEMP_ROOT -OutputDirectory (Join-Path $env:TOKEN_ROOT 'public')
            $result=& $python @($invocation.Arguments)
            if($LASTEXITCODE -ne 0 -or $result -cne 'token-artifact-admission-pass'){throw 'Token artifact admission failed'}
            $admitted=$true
          }
          @{sourceBound=$bound;sourceSnapshotMatches=$sourceMatches;headMatches=$headMatches;clean=$clean;checkedFiles=$capture.Files.Count;publicReceiptAdmitted=$admitted;captureAttempted=$false;metadataComplete=$false} | ConvertTo-Json | Set-Content (Join-Path $env:TOKEN_ROOT 'binding.json')
          "receipt-admitted=$($admitted.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Record separate source, controls, execution and binding outcomes
        if: always() && steps.prepare.outcome == 'success'
        shell: pwsh
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          CONTROL_OUTCOME: ${{ steps.controls.outcome }}
          TOKEN_OUTCOME: ${{ steps.token.outcome }}
          BINDING_OUTCOME: ${{ steps.binding.outcome }}
          RECEIPT_ADMITTED: ${{ steps.binding.outputs.receipt-admitted }}
          EXECUTION_JSON: ${{ steps.token.outputs.execution }}
          PUBLIC_RECEIPT: ${{ steps.token.outputs.public-receipt }}
        run: |
          $execution=$null
          if (-not [string]::IsNullOrEmpty($env:EXECUTION_JSON)) { $execution=$env:EXECUTION_JSON | ConvertFrom-Json }
          @{source=$env:SOURCE_OUTCOME;controls=$env:CONTROL_OUTCOME;collector=$env:TOKEN_OUTCOME;binding=$env:BINDING_OUTCOME;execution=$execution;publicReceiptAdmitted=($env:BINDING_OUTCOME -ceq 'success' -and $env:RECEIPT_ADMITTED -ceq 'true');captureAttempted=$false;metadataComplete=$false} | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $env:TOKEN_ROOT 'outcome.json')
      - name: Retain explicit token source and outcome evidence
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-reliability-token-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TOKEN_ROOT }}/source-check.json
            ${{ env.TOKEN_ROOT }}/source.json
            ${{ env.TOKEN_ROOT }}/binding.json
            ${{ env.TOKEN_ROOT }}/outcome.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain independently validated public token receipt only
        if: always() && steps.binding.outcome == 'success' && steps.binding.outputs.receipt-admitted == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-reliability-token-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TOKEN_ROOT }}/public/receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Require complete collection and protected publication
        if: always() && steps.prepare.outcome == 'success'
        shell: pwsh
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          CONTROL_OUTCOME: ${{ steps.controls.outcome }}
          TOKEN_OUTCOME: ${{ steps.token.outcome }}
          BINDING_OUTCOME: ${{ steps.binding.outcome }}
          RECEIPT_ADMITTED: ${{ steps.binding.outputs.receipt-admitted }}
          PUBLIC_RECEIPT: ${{ steps.token.outputs.public-receipt }}
        run: |
          if ($env:SOURCE_OUTCOME -cne 'success' -or $env:CONTROL_OUTCOME -cne 'success' -or $env:TOKEN_OUTCOME -cne 'success' -or $env:BINDING_OUTCOME -cne 'success' -or $env:RECEIPT_ADMITTED -cne 'true' -or [string]::IsNullOrEmpty($env:PUBLIC_RECEIPT)) { throw 'Token collection/publication remains incomplete' }
