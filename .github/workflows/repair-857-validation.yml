name: Temporary authority wire validation

on:
  push:
    branches: [fix/857-automation-transport-authority]
    paths: [.github/workflows/repair-857-validation.yml]

permissions:
  contents: read

jobs:
  regression:
    if: github.repository == 'OpenCoven/coven' && github.ref == 'refs/heads/fix/857-automation-transport-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/coven-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rename regression cases and format wire test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/coven-cli/src/automations/transport_authority_tests.rs')
          s = p.read_text()
          for old, new in [('tcp_mutations_are_refused_before_store_open_or_runtime_effects', 'mutations_are_refused_before_store_open_or_runtime_effects'), ('tcp_refusal_cannot_reserve_an_owners_adoption_key', 'refusal_cannot_reserve_an_owners_adoption_key'), ('tcp_cannot_replay_or_mutate_an_owners_committed_definition', 'untrusted_transport_cannot_replay_or_mutate_an_owners_committed_definition')]:
              assert s.count('fn ' + old + '(') == 1, old
              s = s.replace('fn ' + old + '(', 'fn ' + new + '(')
          p.write_text(s)
          PY
          cargo fmt --all
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {'crates/coven-cli/src/automations/transport_authority_tests.rs', 'crates/coven-cli/tests/automation_authority_transport.rs'}
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert actual <= allowed, actual - allowed
          PY
          git config user.name 'Valentina Alexander'
          git config user.email '68980965+BunsDev@users.noreply.github.com'
          git add crates/coven-cli/src/automations/transport_authority_tests.rs crates/coven-cli/tests/automation_authority_transport.rs
          git commit -s -m 'test: verify actual daemon owner IPC and unauthenticated TCP boundary'
      - name: Publish only to isolated repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/857-automation-transport-authority | cut -f1)" = "$GITHUB_SHA"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/857-automation-transport-authority
          git rev-parse HEAD
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/coven-target
          key: ${{ runner.os }}-rust-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-test-
      - run: bash scripts/install-native-link-dependencies.sh
      - name: Real daemon IPC and TCP conformance
        run: cargo test --locked -p coven-cli --test automation_authority_transport -- --nocapture
      - name: Request handler regression
        if: ${{ !cancelled() }}
        run: cargo test --locked -p coven-cli --bin coven transport_authority_tests -- --nocapture
      - name: Formatting, secret, contract, and security guards
        if: ${{ !cancelled() }}
        run: |
          cargo fmt --check
          python3 scripts/check-api-contract-docs.py
          python3 scripts/check-secrets.py
          python3 scripts/check-security-policy.py
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
