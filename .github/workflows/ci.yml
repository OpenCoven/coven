name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      rust: ${{ steps.classify.outputs.rust }}
      afs: ${{ steps.classify.outputs.afs }}
      channels: ${{ steps.classify.outputs.channels }}
      openclaw: ${{ steps.classify.outputs.openclaw }}
      npm_packaging: ${{ steps.classify.outputs.npm_packaging }}
      engine: ${{ steps.classify.outputs.engine }}
      workflow: ${{ steps.classify.outputs.workflow }}
      cargo_metadata: ${{ steps.classify.outputs.cargo_metadata }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Collect changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..${AFTER_SHA}"
          else
            empty_tree="$(git hash-object -t tree -w --stdin </dev/null)"
            range="${empty_tree}..${AFTER_SHA}"
          fi
          git diff --name-only --diff-filter=ACMRD "$range" > changed-files.txt
      - name: Classify changed paths
        id: classify
        run: python3 scripts/classify-ci-changes.py --github-output "$GITHUB_OUTPUT" < changed-files.txt

  policy-guard:
    name: Policy guard
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 24
      - run: python scripts/check-coven-privacy-test.py
      - run: python scripts/check-secrets-test.py
      - run: python3 scripts/check-api-contract-docs-test.py
      - run: python3 scripts/check-api-contract-docs.py
      - run: python3 scripts/check-docs-ownership-test.py
      - run: python scripts/check-secrets.py
      - name: Documentation ownership guard (pull request changes)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-docs-ownership.py --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Documentation ownership guard (pushed changes)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BEFORE_SHA="$(git hash-object -t tree -w --stdin </dev/null)"
          fi
          python3 scripts/check-docs-ownership.py --range "${BEFORE_SHA}..${AFTER_SHA}"
      - name: Coven privacy guard (pull request changes)
        if: github.event_name == 'pull_request'
        run: python scripts/check-coven-privacy.py --range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Coven privacy guard (pushed changes)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BEFORE_SHA="$(git hash-object -t tree -w --stdin </dev/null)"
          fi
          python scripts/check-coven-privacy.py --range "${BEFORE_SHA}..${AFTER_SHA}"
      - run: python3 scripts/classify-ci-changes-test.py
      - run: python3 scripts/check-workflows-test.py
      - run: python3 scripts/check-ci-workflow-test.py
      - run: node --test scripts/package-github-release-test.mjs
      - run: node --test scripts/release-stress-test.mjs
      - run: scripts/check-workflows.sh

  rust-lint-linux:
    name: Rust lint (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-lint-
      - name: Install native link dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test-linux:
    name: Rust tests (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-test-
      - name: Install native link dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev
      - run: cargo test --workspace --locked

  rust-test-windows:
    name: Rust tests (Windows)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-test-
      - run: cargo test --workspace --locked

  # macOS runners bill at roughly ten times the Linux rate, so this follows the
  # npm-onboarding split: a cheap matrix on pull requests, the full one on main.
  # Gated on `rust` as well as the event so a docs-only merge does not spend a
  # macOS runner. Before this existed the macOS workspace suite had no CI job at
  # all -- only AFS mount coverage -- so that leg of the release reliability gate
  # depended on an operator remembering to run it locally.
  rust-test-macos:
    name: Rust tests (macOS)
    needs: changes
    if: ${{ github.event_name == 'push' && needs.changes.outputs.rust == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-test-
      - run: cargo test --workspace --locked

  afs-mount-linux:
    name: AFS mount backend (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.afs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-afs-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-afs-
      - name: Install native link dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev
      - name: Clippy (coven-afs mount feature)
        run: cargo clippy -p coven-afs --features mount --all-targets -- -D warnings
      - name: Test (coven-afs mount feature)
        run: cargo test -p coven-afs --features mount --locked

  afs-mount-macos:
    name: AFS mount backend (macOS)
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.afs == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-afs-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-afs-
      - name: Clippy (coven-afs mount feature)
        run: cargo clippy -p coven-afs --features mount --all-targets -- -D warnings
      - name: Test (coven-afs mount feature)
        run: cargo test -p coven-afs --features mount --locked
      - name: Probe a real mount (informational)
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        run: ./scripts/afs-mount-smoke.sh

  performance-baseline:
    name: CLI performance baseline
    needs: changes
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Baseline collection is I/O bound (it seeds 10k-session and 10k-event
    # fixtures), so wall time swings with shared-runner disk speed. A healthy
    # job finishes in ~9 minutes; a slow runner has been observed at ~2.6x that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-perf-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-perf-
      - name: Install native link dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev
      - name: Build coven
        run: cargo build -p coven-cli --locked
      - name: Validate benchmark runner
        run: node --test scripts/benchmark-cli.test.mjs scripts/benchmark-chaos.test.mjs
      - name: Collect non-gating baseline artifact
        # Non-gating in name and now in behaviour: a wedged or very slow
        # collection is bounded here so it cannot burn the whole job budget and
        # cancel the run. `continue-on-error` matches the concurrent-runtime
        # step below; `Validate benchmark runner` above stays gating, so real
        # harness breakage is still caught.
        timeout-minutes: 20
        continue-on-error: true
        run: node scripts/benchmark-cli.mjs --binary target/debug/coven --iterations 3 --output coven-perf.json
      - name: Collect concurrent runtime baseline artifact
        continue-on-error: true
        run: node scripts/benchmark-chaos.mjs --binary target/debug/coven --output coven-chaos.json
      - name: Collect deterministic TUI scheduling metric
        run: |
          set -o pipefail
          cargo test -p coven-cli --bin coven tui::chat::events::tests::benchmark_schedule_metrics_emit_json --locked -- --ignored --nocapture | tee coven-tui-metrics.txt
      - name: Upload baseline artifact
        uses: actions/upload-artifact@v7
        with:
          name: coven-cli-performance-baseline
          path: |
            coven-perf.json
            coven-chaos.json
            coven-tui-metrics.txt
          if-no-files-found: error
      - name: Verify baseline collection produced its artifact
        # `Collect non-gating baseline artifact` is `continue-on-error`, so a
        # wedged or timed-out collection would otherwise leave this job green
        # with `coven-perf.json` missing and nobody the wiser. The upload's
        # `if-no-files-found: error` does not catch that: it only fires when
        # *zero* paths match, and the chaos/TUI outputs would still be present.
        #
        # This runs after the upload on purpose, so whatever partial output
        # exists is still preserved for diagnosis before the job goes red.
        # `performance-baseline` is push-only and `pr-gate` sees it as skipped
        # on pull requests, so failing here surfaces the gap on main without
        # blocking anyone's PR.
        run: |
          set -uo pipefail
          status=0
          if [ ! -s coven-perf.json ]; then
            echo "::error::coven-perf.json is missing or empty - the baseline collection step did not complete (timed out, wedged, or failed)"
            status=1
          elif ! python3 -c 'import json,sys; json.load(open("coven-perf.json"))' 2>/dev/null; then
            echo "::error::coven-perf.json exists but is not valid JSON - the baseline collection step was interrupted mid-write"
            status=1
          else
            echo "coven-perf.json present and parseable"
          fi
          # The remaining outputs keep their existing tolerant behaviour; a
          # warning records the gap without changing what they gate.
          for optional in coven-chaos.json coven-tui-metrics.txt; do
            if [ ! -s "$optional" ]; then
              echo "::warning::${optional} is missing or empty"
            fi
          done
          exit "$status"

  channels:
    name: Channels package
    needs: changes
    if: ${{ needs.changes.outputs.channels == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/channels/package-lock.json
      - run: npm ci
        working-directory: packages/channels
      - run: npm run build
        working-directory: packages/channels
      - run: npm test
        working-directory: packages/channels

  openclaw-bridge:
    name: OpenClaw bridge
    needs: changes
    if: ${{ needs.changes.outputs.openclaw == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.11.1 --activate
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-openclaw-${{ hashFiles('packages/openclaw-coven/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-openclaw-
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: packages/openclaw-coven
      - run: pnpm run build
        working-directory: packages/openclaw-coven
      - run: pnpm test
        working-directory: packages/openclaw-coven

  npm-onboarding-pr:
    name: npm onboarding smoke (${{ matrix.npm-target }})
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.npm_packaging == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            npm-target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            npm-target: windows
            rust-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-npm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-npm-
      - name: Install native link dependencies (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev
      - run: cargo build --release --package coven-cli --target ${{ matrix.rust-target }}
      - run: node scripts/test-cli-prepublish.mjs --target=${{ matrix.npm-target }} --skip-build --skip-secrets-scan
        env:
          COVEN_NPM_DRY_RUN_VERSION: 999.0.0

  npm-onboarding-main:
    name: npm onboarding smoke (${{ matrix.npm-target }})
    needs: changes
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            npm-target: macos
            rust-target: aarch64-apple-darwin
          - os: macos-15-intel
            npm-target: macos-x64
            rust-target: x86_64-apple-darwin
          - os: ubuntu-latest
            npm-target: linux-x64
            rust-target: x86_64-unknown-linux-gnu
          - os: windows-latest
            npm-target: windows
            rust-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-npm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-npm-
      - name: Install native link dependencies (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev
      - run: cargo build --release --package coven-cli --target ${{ matrix.rust-target }}
      - name: Build the AFS mount export helper (macOS only)
        if: startsWith(matrix.npm-target, 'macos')
        run: cargo build --release -p coven-afs --features mount --bins --target ${{ matrix.rust-target }}
      - run: node scripts/test-cli-prepublish.mjs --target=${{ matrix.npm-target }} --skip-build --skip-secrets-scan
        env:
          COVEN_NPM_DRY_RUN_VERSION: 999.0.0

  engine-contract:
    name: engine contract
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-engine-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-engine-
      - name: Install native link dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopenblas-dev
      - name: Build coven
        run: cargo build -p coven-cli --locked
      - name: Install the pinned engine
        run: cargo run -p coven-cli --locked -- engine install
      - name: Run contract tests against the pinned engine
        run: |
          ENGINE="$HOME/.coven/engine/$(cat "$HOME/.coven/engine/current")/coven-code"
          echo "engine: $ENGINE"
          "$ENGINE" --version
          COVEN_ENGINE_BIN="$ENGINE" cargo test -p coven-cli --locked contract -- --nocapture

  cargo-deny:
    name: Dependency audit
    needs: changes
    if: ${{ github.event_name == 'push' || needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  pr-gate:
    name: PR gate
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - policy-guard
      - rust-lint-linux
      - rust-test-linux
      - rust-test-windows
      - rust-test-macos
      - afs-mount-linux
      - afs-mount-macos
      - performance-baseline
      - channels
      - openclaw-bridge
      - npm-onboarding-pr
      - npm-onboarding-main
      - engine-contract
      - cargo-deny
    env:
      JOB_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require successful or intentional skipped jobs
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["JOB_RESULTS"])
          bad = {
              name: data["result"]
              for name, data in jobs.items()
              if data["result"] not in {"success", "skipped"}
          }
          for required in ("changes", "policy-guard"):
              if jobs[required]["result"] != "success":
                  bad[required] = jobs[required]["result"]
          if bad:
              raise SystemExit(
                  "PR gate rejected job results: "
                  + ", ".join(f"{name}={result}" for name, result in sorted(bad.items()))
              )
          print("PR gate accepted all required and conditional jobs")
          PY
