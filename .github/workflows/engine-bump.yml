name: Engine bump

# Proposes the latest OpenCoven/coven-code release as the pinned engine and
# opens a pull request for a person to review and merge. It runs daily, and
# coven-code's release workflow dispatches it as soon as a release is
# published.
#
# The pull request has to be opened with ENGINE_BUMP_TOKEN, a repository secret
# holding a token with contents and pull-request write access to this
# repository. GITHUB_TOKEN may not open pull requests here, and a pull request
# it opens starts no CI. Without the secret the run fails and says so.
on:
  schedule:
    - cron: '17 8 * * *' # daily, arbitrary minute to avoid the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A scheduled run and a dispatched one must not both push the same branch.
concurrency:
  group: engine-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Propose engine pin bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ secrets.ENGINE_BUMP_TOKEN || github.token }}

      - name: Detect latest engine release vs the pin
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(gh release view --repo OpenCoven/coven-code --json tagName -q .tagName)"
          latest="${latest#v}"
          current="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/coven-cli/engine.lock)"
          echo "latest=$latest"  >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
          else
            echo "newer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the pin and open a PR
        if: steps.detect.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.ENGINE_BUMP_TOKEN || github.token }}
          WORKFLOW_TOKEN_ONLY: ${{ secrets.ENGINE_BUMP_TOKEN == '' }}
          LATEST: ${{ steps.detect.outputs.latest }}
        run: bash scripts/propose-engine-bump.sh "$LATEST"
