name: Release governance check

# Compares live repository protection with .github/release-governance.json (#805):
# the same check every release runs before publication. The weekly run catches drift
# between releases, such as a break-glass change left in place, an edited ruleset, or
# an expired RELEASE_GOVERNANCE_READ_TOKEN, before a release finds it. Dispatch it
# after changing protection or rotating the credential.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * 1'

permissions:
  contents: read

concurrency:
  group: release-governance-check
  cancel-in-progress: true

jobs:
  check:
    name: Release governance check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Only the dedicated credential can see ruleset bypass actors and classic
      # protection. Without it the check has no credential at all and refuses.
      - name: Compare live protection with the governance policy
        env:
          RELEASE_GOVERNANCE_READ_TOKEN: ${{ secrets.RELEASE_GOVERNANCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release-governance.mjs check \
            --repository "$GITHUB_REPOSITORY" \
            --snapshot-output governance/snapshot.json \
            --output governance/evaluation.json
      - name: Retain the snapshot and evaluation
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-governance-${{ github.run_id }}
          path: governance/
          if-no-files-found: warn
