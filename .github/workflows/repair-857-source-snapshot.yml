name: Temporary authority repair source snapshot

on:
  push:
    branches: [fix/857-automation-transport-authority]
    paths: [.github/workflows/repair-857-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'OpenCoven/coven' && github.ref == 'refs/heads/fix/857-automation-transport-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archive public tracked repair inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair-inputs"
          for repo in coven-cave coven-docs; do
            source="$RUNNER_TEMP/source-$repo"
            git init "$source"
            git -C "$source" remote add origin "https://github.com/OpenCoven/$repo.git"
            git -C "$source" fetch --depth=1 origin main
            git -C "$source" archive --format=tar --output="$RUNNER_TEMP/repair-inputs/$repo.tar" FETCH_HEAD
            git -C "$source" rev-parse FETCH_HEAD > "$RUNNER_TEMP/repair-inputs/$repo-commit.txt"
            sha256sum "$RUNNER_TEMP/repair-inputs/$repo.tar" > "$RUNNER_TEMP/repair-inputs/$repo-sha256.txt"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: cave-docs-repair-inputs-${{ github.sha }}
          path: ${{ runner.temp }}/repair-inputs
          retention-days: 1
          if-no-files-found: error
