[package]
name = "opencoven-coven-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Owner-adjacent Rust client for the OpenCoven Coven daemon: coven.daemon.v1 discovery, same-user local IPC transport, health probes, and typed errors."
readme = "README.md"
documentation = "https://docs.rs/opencoven-coven-client"
homepage = "https://github.com/OpenCoven/coven/tree/main/crates/coven-client"
keywords = ["opencoven", "coven", "daemon", "client", "ipc"]
categories = ["api-bindings", "development-tools"]
# The published tarball is exactly the source, its fixtures, its tests, and
# this README. Fixtures are part of the contract: the package-contract test
# reads them, so a tarball without them cannot pass its own tests.
include = ["Cargo.toml", "README.md", "src/**/*.rs", "tests/**/*.rs", "fixtures/**"]

# The package is published as `opencoven-coven-client`; the library keeps its
# original `coven_client` name so `coven-cli`, this crate's integration tests,
# and downstream code compose over it without a rename.
[lib]
name = "coven_client"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
siphasher = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }
