[package]
name = "coven-afs"
version = "0.1.0"
description = "Native OpenCoven agent filesystem: AgentFS SPEC v0.4-compatible SQLite storage with copy-on-write overlay"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Mount backends pull in tokio and an RPC stack; the storage engine does not
# need them, so exporting a filesystem is opt-in.
mount = [
    "dep:nfsserve",
    "dep:async-trait",
    "dep:tokio",
    "dep:libc",
    "dep:hmac",
    "dep:sha2",
    "dep:getrandom",
    "dep:tracing-subscriber",
]

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
nfsserve = { version = "0.11", optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
libc = { version = "0.2", optional = true }
# File-handle authentication (see the Trust section in src/nfs.rs). All three
# are already in the workspace lock, so the mount feature pulls in no new
# transitive dependencies.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.11", optional = true }
getrandom = { version = "0.2", optional = true }
# Only the out-of-process export binary initializes a subscriber; the library
# stays subscriber-agnostic and merely emits `tracing` events.
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "afs_serve"
required-features = ["mount"]

# The export process the daemon spawns per mount. Behind the same feature as
# the backend it serves, so a build without `mount` produces no binary that
# could be run by mistake.
[[bin]]
name = "coven-afs-serve"
path = "src/bin/coven-afs-serve.rs"
required-features = ["mount"]
