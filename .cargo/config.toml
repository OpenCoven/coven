# Fetch git dependencies with the system `git` CLI instead of libgit2. The
# OpenCoven git dependencies in Cargo.lock are public and fetch anonymously, so
# no credential is involved. The CLI keeps those fetches on the same git
# transport, proxy and CA configuration as the checkout itself; revisit once a
# managed Cloud run shows libgit2 behaves identically behind its proxy (#1447).
[net]
git-fetch-with-cli = true
